<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MathMaster">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='26' fill='%230f172a'/%3E%3Ctext x='60' y='78' font-size='60' text-anchor='middle'%3E📐%3C/text%3E%3C/svg%3E">
  <link rel="manifest" href="data:application/json,%7B%22name%22%3A%22MathMaster%20IEB%22%2C%22short_name%22%3A%22MathMaster%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%230f172a%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%2520viewBox%3D'0%25200%2520120%2520120'%253E%253Crect%2520width%3D'120'%2520height%3D'120'%2520rx%3D'26'%2520fill%3D'%25230f172a'%2F%253E%253Ctext%2520x%3D'60'%2520y%3D'78'%2520font-size%3D'60'%2520text-anchor%3D'middle'%253E%25F0%259F%2593%2590%253C%2Ftext%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22any%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
  <title>MathMaster — IEB Math Learning</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* ── TOKENS ─────────────────────────────────────────── */
    :root {
      --navy:       #0f172a;
      --navy-light: #1e293b;
      --cream:      #f8f5f0;
      --white:      #ffffff;
      --accent-num: #f59e0b;
      --accent-frac:#10b981;
      --accent-alg: #6366f1;
      --accent-geo: #ef4444;
      --accent-dat: #0ea5e9;
      --accent-data:#0ea5e9;
      --accent-rat: #8b5cf6;
      --accent-meas:#14b8a6;
      --success:    #22c55e;
      --error:      #ef4444;
      --neutral:    #94a3b8;
      --sidebar-w:  280px;
      --topbar-h:   60px;
    }

    /* ── RESET ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--navy);
      font-size: 16px;
      line-height: 1.6;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    h1,h2,h3,h4,h5 { font-family: 'Sora', sans-serif; line-height: 1.3; }
    code, .mono    { font-family: 'JetBrains Mono', monospace; }
    button         { cursor: pointer; font-family: 'DM Sans', sans-serif; }
    a              { color: inherit; text-decoration: none; }

    /* ── TOP BAR ─────────────────────────────────────────── */
    #top-bar {
      height: var(--topbar-h);
      background: var(--navy);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      flex-shrink: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.3);
    }
    .logo {
      font-family: 'Sora', sans-serif;
      font-weight: 800;
      font-size: 1.15rem;
      color: var(--white);
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }
    .logo-accent { color: var(--accent-num); }

    .grade-selector { display: flex; gap: 4px; margin-left: 16px; }
    .grade-btn {
      background: transparent;
      border: 1.5px solid rgba(255,255,255,.22);
      color: rgba(255,255,255,.55);
      padding: 4px 11px;
      border-radius: 20px;
      font-size: .78rem;
      font-weight: 600;
      transition: all .18s;
      letter-spacing: .02em;
    }
    .grade-btn:hover  { border-color: rgba(255,255,255,.5); color: var(--white); }
    .grade-btn.active { background: var(--accent-num); border-color: var(--accent-num); color: var(--navy); }

    .top-stats { margin-left: auto; display: flex; align-items: center; gap: 18px; }
    .stat-badge {
      display: flex; align-items: center; gap: 5px;
      color: var(--white); font-weight: 600; font-size: .88rem;
      white-space: nowrap;
    }
    .stat-badge .si { font-size: 1rem; }
    .stat-badge .si.gold { color: var(--accent-num); }
    .stat-num { font-family: 'Sora', sans-serif; }

    /* ── MAIN LAYOUT ─────────────────────────────────────── */
    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
      height: calc(100vh - var(--topbar-h));
    }

    /* ── SIDEBAR ─────────────────────────────────────────── */
    #sidebar {
      width: var(--sidebar-w);
      background: var(--navy-light);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      flex-shrink: 0;
    }
    #sidebar::-webkit-scrollbar { width: 4px; }
    #sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 2px; }

    .sidebar-label {
      padding: 18px 16px 10px;
      color: rgba(255,255,255,.32);
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .module-item {
      border-left: 3px solid transparent;
      transition: background .18s, border-color .18s;
      cursor: pointer;
      user-select: none;
    }
    .module-item:hover                { background: rgba(255,255,255,.06); }
    .module-item.active               { background: rgba(255,255,255,.09); }

    .module-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
    }
    .module-icon  { font-size: 1.1rem; width: 26px; text-align: center; flex-shrink: 0; }
    .module-info  { flex: 1; min-width: 0; }
    .module-name  {
      font-weight: 600; font-size: .82rem;
      color: rgba(255,255,255,.88);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .module-sub   { font-size: .68rem; color: rgba(255,255,255,.36); margin-top: 1px; }

    .topic-list { display: none; background: rgba(0,0,0,.18); padding: 3px 0 6px; }
    .topic-list.open { display: block; }

    .topic-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 14px 7px 48px;
      cursor: pointer; font-size: .78rem;
      color: rgba(255,255,255,.46);
      transition: all .15s;
    }
    .topic-item:hover        { color: rgba(255,255,255,.82); background: rgba(255,255,255,.04); }
    .topic-item.active       { color: var(--white); font-weight: 600; }
    .topic-check {
      width: 13px; height: 13px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,.2);
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      font-size: 7px; color: transparent; transition: all .2s;
    }
    .topic-item.done .topic-check { background: var(--success); border-color: var(--success); color: var(--white); }

    /* ── CONTENT PANEL ───────────────────────────────────── */
    #content-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--cream);
    }
    .panel-top { padding: 14px 32px 0; flex-shrink: 0; }

    .breadcrumb {
      display: flex; align-items: center; gap: 6px;
      font-size: .76rem; color: var(--neutral); margin-bottom: 10px;
    }
    .breadcrumb .bc-cur { color: var(--navy); font-weight: 500; }

    .tab-strip { display: flex; border-bottom: 2px solid rgba(0,0,0,.07); }
    .tab-btn {
      background: none; border: none;
      padding: 9px 18px;
      font-weight: 600; font-size: .87rem;
      color: var(--neutral);
      position: relative; transition: color .18s;
      display: flex; align-items: center; gap: 6px;
    }
    .tab-btn::after {
      content: ''; position: absolute;
      bottom: -2px; left: 0; right: 0; height: 2px;
      background: transparent; transition: background .18s;
    }
    .tab-btn:hover        { color: var(--navy); }
    .tab-btn.active       { color: var(--navy); }
    .tab-btn.active::after{ background: var(--navy); }
    .tab-btn i            { font-size: .8rem; }

    .content-area {
      flex: 1; overflow-y: auto;
      padding: 28px 32px 56px;
    }
    .content-area::-webkit-scrollbar       { width: 6px; }
    .content-area::-webkit-scrollbar-thumb { background: rgba(0,0,0,.12); border-radius: 3px; }

    /* ── LESSON VIEW ─────────────────────────────────────── */
    .lesson-intro {
      font-size: 1.02rem; color: #374151;
      line-height: 1.75; max-width: 700px;
      padding: 16px 20px; background: var(--white);
      border-radius: 10px;
      border-left: 4px solid var(--mod-accent, var(--accent-num));
      margin-bottom: 26px;
    }
    .lesson-section     { margin-bottom: 26px; max-width: 700px; }
    .lesson-section h2  { font-size: 1.08rem; font-weight: 700; margin-bottom: 10px; color: var(--navy); }
    .lesson-body        { line-height: 1.78; color: #374151; }
    .lesson-body strong { font-weight: 600; color: var(--navy); }
    .lesson-body em     { font-style: italic; }
    .lesson-body code   { background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 3px; font-size: .9em; }

    .key-facts {
      background: var(--white);
      border: 1px solid rgba(0,0,0,.07);
      border-left: 4px solid var(--mod-accent, var(--accent-num));
      border-radius: 10px; padding: 18px 22px;
      margin-top: 26px; max-width: 700px;
    }
    .key-facts h3 {
      font-size: .74rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .1em;
      color: var(--mod-accent, var(--accent-num)); margin-bottom: 10px;
    }
    .key-facts ul  { list-style: none; display: flex; flex-direction: column; gap: 7px; }
    .key-facts li  { display: flex; gap: 8px; font-size: .88rem; color: #374151; align-items: flex-start; }
    .key-facts li::before { content: '✓'; color: var(--mod-accent, var(--accent-num)); font-weight: 700; flex-shrink: 0; margin-top: 1px; }

    .btn-cta {
      margin-top: 26px; display: inline-flex; align-items: center; gap: 8px;
      padding: 11px 22px; background: var(--navy); color: var(--white);
      border: none; border-radius: 8px;
      font-weight: 600; font-size: .9rem; transition: all .18s;
    }
    .btn-cta:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(15,23,42,.25); }

    /* Visuals */
    .visual-wrap {
      margin: 18px 0; padding: 18px;
      background: var(--white); border-radius: 10px;
      border: 1px solid rgba(0,0,0,.07); overflow-x: auto;
    }
    .pv-table { border-collapse: collapse; font-family: 'JetBrains Mono', monospace; white-space: nowrap; }
    .pv-table th { background: var(--navy); color: var(--white); padding: 7px 12px; font-size: .72rem; font-weight: 600; border: 1px solid rgba(255,255,255,.1); text-align: center; }
    .pv-table td { padding: 9px 12px; border: 1px solid #e5e7eb; text-align: center; font-size: 1.05rem; font-weight: 700; color: var(--navy); min-width: 52px; }
    .pv-table td.hl { background: rgba(245,158,11,.14); color: var(--accent-num); }

    .fbar-wrap { display: flex; flex-direction: column; gap: 6px; }
    .fbar { display: flex; height: 38px; border-radius: 6px; overflow: hidden; border: 1px solid rgba(0,0,0,.1); width: 360px; max-width: 100%; }
    .fbar-seg { flex: 1; border-right: 1px solid rgba(255,255,255,.4); }
    .fbar-seg:last-child { border-right: none; }
    .fbar-seg.filled { background: var(--accent-frac); }
    .fbar-seg.empty  { background: #e5e7eb; }
    .fbar-label { font-size: .82rem; color: var(--neutral); }

    /* ── WORKED EXAMPLES ─────────────────────────────────── */
    .we-wrap       { max-width: 680px; }
    .we-qbox {
      background: var(--navy); color: var(--white);
      padding: 18px 22px; border-radius: 12px;
      font-family: 'Sora', sans-serif; font-size: 1rem;
      font-weight: 600; line-height: 1.55; margin-bottom: 22px;
    }
    .steps-list    { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .step-card     {
      border: 1px solid rgba(0,0,0,.08); border-radius: 10px;
      background: var(--white); overflow: hidden;
      opacity: 0; transform: translateY(10px); pointer-events: none;
    }
    .step-card.visible {
      opacity: 1; transform: translateY(0); pointer-events: auto;
      animation: stepIn .32s ease forwards;
    }
    @keyframes stepIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .step-head {
      padding: 8px 14px; background: var(--navy-light);
      color: rgba(255,255,255,.75);
      font-size: .74rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .07em;
    }
    .step-body { padding: 13px 16px 6px; color: #374151; font-size: .9rem; line-height: 1.65; }
    .step-hl {
      margin: 8px 16px 14px; padding: 9px 13px;
      background: rgba(99,102,241,.07);
      border-left: 3px solid var(--accent-alg);
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: .88rem; color: var(--navy);
    }
    .answer-reveal {
      background: linear-gradient(135deg,rgba(34,197,94,.1),rgba(34,197,94,.04));
      border: 1px solid rgba(34,197,94,.28);
      border-left: 4px solid var(--success);
      border-radius: 10px; padding: 14px 18px;
      font-family: 'Sora', sans-serif;
      font-size: 1.05rem; font-weight: 700; color: #15803d;
      display: none; animation: stepIn .32s ease;
    }
    .answer-reveal.visible { display: block; }
    .ans-label {
      font-size: .72rem; text-transform: uppercase;
      letter-spacing: .08em; color: var(--success);
      margin-bottom: 4px; font-family: 'DM Sans', sans-serif;
    }
    .we-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
    .btn-step {
      padding: 10px 20px; background: var(--accent-alg);
      color: var(--white); border: none; border-radius: 8px;
      font-weight: 600; font-size: .88rem; transition: all .18s;
    }
    .btn-step:hover:not(:disabled) { opacity: .88; transform: translateY(-1px); }
    .btn-step:disabled { background: var(--neutral); cursor: not-allowed; }

    .btn-nav {
      padding: 9px 18px;
      border: 1.5px solid rgba(0,0,0,.14);
      border-radius: 8px; background: var(--white);
      font-weight: 600; font-size: .85rem; color: var(--navy);
      transition: all .18s; display: flex; align-items: center; gap: 6px;
    }
    .btn-nav:hover:not(:disabled) { background: var(--navy); color: var(--white); border-color: var(--navy); }
    .btn-nav:disabled { opacity: .35; cursor: not-allowed; }
    .we-counter { margin-left: auto; font-size: .82rem; color: var(--neutral); font-weight: 600; }
    .btn-try {
      padding: 9px 18px;
      background: rgba(99,102,241,.1);
      border: 1.5px solid rgba(99,102,241,.35);
      color: var(--accent-alg); border-radius: 8px;
      font-weight: 600; font-size: .85rem; transition: all .18s;
    }
    .btn-try:hover { background: var(--accent-alg); color: var(--white); }

    /* ── DRILL SETUP ─────────────────────────────────────── */
    .drill-setup       { max-width: 540px; }
    .drill-setup h1    { font-size: 1.5rem; font-weight: 800; margin-bottom: 6px; }
    .drill-setup .sub  { color: var(--neutral); margin-bottom: 28px; font-size: .92rem; }
    .setup-group       { margin-bottom: 22px; }
    .setup-group label {
      display: block; font-size: .74rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .09em;
      color: var(--neutral); margin-bottom: 8px;
    }
    .pill-group { display: flex; flex-wrap: wrap; gap: 7px; }
    .pill {
      padding: 7px 15px;
      border: 2px solid rgba(0,0,0,.1);
      border-radius: 22px; background: var(--white);
      font-weight: 600; font-size: .86rem; color: var(--navy);
      transition: all .16s;
    }
    .pill:hover      { border-color: var(--navy); }
    .pill.sel        { background: var(--navy); color: var(--white); border-color: var(--navy); }
    .btn-start {
      margin-top: 8px; padding: 13px 30px;
      background: var(--navy); color: var(--white);
      border: none; border-radius: 10px;
      font-weight: 700; font-size: .95rem; transition: all .18s;
    }
    .btn-start:hover { transform: translateY(-2px); box-shadow: 0 5px 16px rgba(15,23,42,.28); }

    /* ── DRILL QUESTION SCREEN ───────────────────────────── */
    .drill-screen  { max-width: 700px; }
    .drill-hd      { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
    .drill-ptrack  { flex: 1; height: 5px; background: rgba(0,0,0,.08); border-radius: 3px; overflow: hidden; }
    .drill-pfill   { height: 100%; background: var(--navy); border-radius: 3px; transition: width .3s ease; }
    .drill-qnum    { font-size: .82rem; font-weight: 600; color: var(--neutral); white-space: nowrap; }
    .drill-timer   {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600; font-size: .88rem; color: var(--success);
      transition: color .3s; white-space: nowrap; min-width: 52px; text-align: right;
    }
    .drill-timer.amber { color: #d97706; }
    .drill-timer.red   { color: var(--error); }
    .streak-msg { height: 22px; text-align: center; font-size: .84rem; font-weight: 700; color: var(--accent-num); margin-bottom: 10px; }

    .q-card {
      background: var(--white); border-radius: 14px;
      padding: 24px 26px;
      border: 1px solid rgba(0,0,0,.07);
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    .q-diff { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 10px; }
    .q-diff.d1 { background: rgba(34,197,94,.12);  color: #15803d; }
    .q-diff.d2 { background: rgba(245,158,11,.12); color: #92400e; }
    .q-diff.d3 { background: rgba(239,68,68,.12);  color: #991b1b; }
    .q-prompt  { font-family: 'Sora', sans-serif; font-size: 1.05rem; font-weight: 600; color: var(--navy); line-height: 1.5; margin-bottom: 20px; }

    /* Multiple choice */
    .mc-list { display: flex; flex-direction: column; gap: 9px; }
    .mc-opt  {
      display: flex; align-items: center; gap: 11px;
      padding: 12px 16px;
      border: 2px solid rgba(0,0,0,.09); border-radius: 9px;
      background: var(--cream); cursor: pointer;
      transition: all .16s; min-height: 44px; user-select: none;
    }
    .mc-opt:hover:not(.locked)   { border-color: var(--navy); background: var(--white); }
    .mc-opt.sel                  { border-color: var(--navy); background: rgba(15,23,42,.05); }
    .mc-opt.correct              { border-color: var(--success); background: rgba(34,197,94,.07); }
    .mc-opt.wrong                { border-color: var(--error); background: rgba(239,68,68,.06); }
    .mc-opt.locked               { cursor: default; }
    .mc-ltr {
      width: 26px; height: 26px; border-radius: 50%;
      background: rgba(0,0,0,.07);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: .77rem; flex-shrink: 0; transition: all .16s;
    }
    .mc-opt.sel     .mc-ltr { background: var(--navy);    color: var(--white); }
    .mc-opt.correct .mc-ltr { background: var(--success); color: var(--white); }
    .mc-opt.wrong   .mc-ltr { background: var(--error);   color: var(--white); }

    /* Numeric input */
    .ni-wrap  { display: flex; align-items: center; gap: 10px; }
    .ni-input {
      padding: 12px 16px; border: 2px solid rgba(0,0,0,.11);
      border-radius: 9px; font-family: 'JetBrains Mono', monospace;
      font-size: 1.05rem; width: 220px; outline: none;
      transition: border-color .18s; min-height: 44px;
    }
    .ni-input:focus   { border-color: var(--navy); }
    .ni-input.correct { border-color: var(--success); }
    .ni-input.wrong   { border-color: var(--error); }

    /* Fill in blank */
    .fitb-text { font-family: 'Sora', sans-serif; font-size: 1.02rem; font-weight: 600; color: var(--navy); line-height: 2.4; }
    .fitb-in   {
      display: inline-block; border: none;
      border-bottom: 2.5px solid var(--navy);
      background: transparent;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem; font-weight: 600;
      width: 130px; outline: none; text-align: center; padding: 2px 6px;
    }

    /* Ordering */
    .ord-list { display: flex; flex-direction: column; gap: 8px; }
    .ord-item {
      display: flex; align-items: center; gap: 11px;
      padding: 11px 15px; background: var(--white);
      border: 2px solid rgba(0,0,0,.09); border-radius: 8px;
      cursor: grab; user-select: none; transition: all .16s;
    }
    .ord-item:active          { cursor: grabbing; }
    .ord-item.dragging        { opacity: .4; }
    .ord-item.drag-over       { border-color: var(--navy); background: rgba(15,23,42,.04); }
    .ord-item.correct         { border-color: var(--success); background: rgba(34,197,94,.06); }
    .ord-item.wrong           { border-color: var(--error);   background: rgba(239,68,68,.05); }
    .ord-handle               { color: var(--neutral); font-size: .85rem; }
    .ord-text                 { flex: 1; font-weight: 500; font-size: .92rem; }

    /* Matching */
    .match-grid  { display: flex; gap: 20px; }
    .match-col   { flex: 1; display: flex; flex-direction: column; gap: 7px; }
    .match-lbl   { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--neutral); margin-bottom: 2px; }
    .match-item  {
      padding: 11px 14px; border: 2px solid rgba(0,0,0,.09);
      border-radius: 8px; background: var(--white);
      cursor: pointer; font-weight: 500; font-size: .88rem;
      min-height: 44px; display: flex; align-items: center; transition: all .16s;
    }
    .match-item:hover:not(.locked)  { border-color: var(--navy); }
    .match-item.sel                 { border-color: var(--accent-alg); background: rgba(99,102,241,.06); }
    .match-item.matched             { border-color: var(--success); background: rgba(34,197,94,.06); color: #15803d; }
    .match-item.wrong-m             { border-color: var(--error);   background: rgba(239,68,68,.05); color: #991b1b; }
    .match-item.locked              { cursor: default; }

    /* Submit / Next */
    .btn-submit {
      margin-top: 18px; padding: 12px 26px;
      background: var(--navy); color: var(--white);
      border: none; border-radius: 9px;
      font-weight: 700; font-size: .92rem;
      transition: all .18s; min-height: 44px; display: block;
    }
    .btn-submit:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(15,23,42,.28); }
    .btn-submit:disabled { background: var(--neutral); cursor: not-allowed; transform: none; }

    .expl-box { margin-top: 14px; padding: 13px 16px; border-radius: 9px; font-size: .87rem; line-height: 1.6; display: none; }
    .expl-box.visible { display: block; }
    .expl-box.correct { background: rgba(34,197,94,.09);  border: 1px solid rgba(34,197,94,.22); }
    .expl-box.wrong   { background: rgba(239,68,68,.07);  border: 1px solid rgba(239,68,68,.18); }
    .expl-hd          { font-weight: 700; margin-bottom: 4px; }
    .expl-box.correct .expl-hd { color: var(--success); }
    .expl-box.wrong   .expl-hd { color: var(--error); }
    .expl-ans         { font-family: 'JetBrains Mono', monospace; font-weight: 600; }

    .btn-next {
      margin-top: 14px; padding: 10px 22px;
      border: 2px solid var(--navy); border-radius: 8px;
      background: var(--white); color: var(--navy);
      font-weight: 700; font-size: .88rem;
      transition: all .18s; display: none;
    }
    .btn-next.visible { display: inline-block; }
    .btn-next:hover   { background: var(--navy); color: var(--white); }

    /* ── FEEDBACK OVERLAY ────────────────────────────────── */
    #feedback-overlay {
      position: fixed; inset: 0; pointer-events: none;
      opacity: 0; transition: opacity .15s;
      z-index: 500; display: flex; align-items: center;
      justify-content: center; font-size: 3.5rem;
    }
    #feedback-overlay.show    { opacity: 1; }
    #feedback-overlay.correct { background: rgba(34,197,94,.13); }
    #feedback-overlay.wrong   { background: rgba(239,68,68,.12); }

    /* ── END SCREEN ──────────────────────────────────────── */
    .end-screen  { text-align: center; max-width: 480px; margin: 0 auto; padding: 24px 0 48px; }
    .end-score   { font-family: 'Sora', sans-serif; font-size: 3rem; font-weight: 800; color: var(--navy); }
    .end-stars   { font-size: 1.9rem; margin: 8px 0 16px; }
    .end-xp      {
      display: inline-block; padding: 7px 18px;
      background: rgba(245,158,11,.11);
      border: 1px solid rgba(245,158,11,.28);
      border-radius: 18px; color: #92400e;
      font-weight: 700; font-size: .95rem; margin-bottom: 22px;
    }
    .end-stats    { display: flex; justify-content: center; gap: 28px; margin-bottom: 28px; color: var(--neutral); font-size: .88rem; }
    .end-stat     { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .end-stat strong { font-size: 1.25rem; color: var(--navy); font-weight: 700; font-family: 'Sora', sans-serif; }
    .end-actions  { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .end-btn      { padding: 11px 22px; border-radius: 8px; font-weight: 600; font-size: .88rem; border: 2px solid var(--navy); transition: all .18s; }
    .end-btn.pri  { background: var(--navy); color: var(--white); }
    .end-btn.sec  { background: var(--white); color: var(--navy); }
    .end-btn:hover{ transform: translateY(-1px); }

    .wrong-review    { margin-top: 28px; text-align: left; border-top: 1px solid rgba(0,0,0,.07); padding-top: 22px; }
    .wrong-review h3 { font-size: .95rem; margin-bottom: 14px; }
    .wrong-item      { background: var(--white); border-radius: 9px; padding: 12px 16px; margin-bottom: 8px; border-left: 3px solid var(--error); }
    .wi-q            { font-weight: 600; font-size: .87rem; margin-bottom: 5px; }
    .wi-yours        { font-size: .8rem; color: var(--error); }
    .wi-correct      { font-size: .8rem; color: var(--success); }
    .wi-expl         { font-size: .8rem; color: var(--neutral); margin-top: 3px; }

    /* ── PROGRESS RING ───────────────────────────────────── */
    .ring-svg   { transform: rotate(-90deg); }
    .ring-bg    { fill: none; stroke: rgba(255,255,255,.12); }
    .ring-fill  { fill: none; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }

    /* ── EMPTY STATE ─────────────────────────────────────── */
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 280px; color: var(--neutral); text-align: center; gap: 10px; }
    .empty-state i { font-size: 2.8rem; opacity: .35; }
    .empty-state p { font-size: .95rem; max-width: 280px; }

    /* ── XP POP ──────────────────────────────────────────── */
    .xp-pop {
      position: fixed; top: 70px; right: 24px;
      background: var(--accent-num); color: var(--navy);
      font-family: 'Sora', sans-serif; font-weight: 800; font-size: 1rem;
      padding: 6px 14px; border-radius: 20px;
      z-index: 600; pointer-events: none;
      animation: popUp 1.5s ease forwards;
    }
    @keyframes popUp {
      0%   { opacity: 0; transform: translateY(10px); }
      20%  { opacity: 1; transform: translateY(0); }
      80%  { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-22px); }
    }

    /* ── ANIMATIONS ──────────────────────────────────────── */
    .slide-in { animation: slideIn .22s ease forwards; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(16px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ── SAFE AREA / PWA ────────────────────────────────── */
    :root {
      --safe-top:      env(safe-area-inset-top, 0px);
      --safe-bottom:   env(safe-area-inset-bottom, 0px);
      --safe-left:     env(safe-area-inset-left, 0px);
      --safe-right:    env(safe-area-inset-right, 0px);
      --bnav-h:        62px;
    }

    /* Sidebar drawer overlay */
    #sidebar-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.55); z-index: 200;
      backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
    }
    #sidebar-overlay.show { display: block; }

    /* Bottom navigation bar */
    #bottom-nav {
      display: none; position: fixed;
      bottom: 0; left: 0; right: 0;
      height: calc(var(--bnav-h) + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: var(--navy);
      border-top: 1px solid rgba(255,255,255,.1);
      z-index: 150;
    }
    #bottom-nav .bnav-inner {
      display: flex; height: var(--bnav-h);
    }
    .bnav-btn {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 3px;
      background: none; border: none;
      color: rgba(255,255,255,.42);
      font-size: .62rem; font-weight: 600; letter-spacing: .03em;
      padding: 0; min-height: 44px; transition: color .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .bnav-btn i { font-size: 1.25rem; }
    .bnav-btn.active { color: var(--accent-num); }
    .bnav-btn:active { opacity: .65; }

    /* Hamburger button */
    .hamburger {
      display: none; background: none; border: none;
      color: var(--white); font-size: 1.15rem;
      min-width: 44px; min-height: 44px;
      align-items: center; justify-content: center;
      margin-right: 2px; border-radius: 8px;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── MOBILE ──────────────────────────────────────────── */
    @media (max-width: 768px) {
      /* Show mobile-specific chrome */
      .hamburger   { display: flex; }
      #bottom-nav  { display: block; }

      /* Top bar: safe area + compact */
      #top-bar {
        padding: 0 12px 0 8px;
        padding-top: var(--safe-top);
        height: calc(var(--topbar-h) + var(--safe-top));
      }
      body { overflow: hidden; }

      /* Grade pills: scrollable strip */
      .grade-selector {
        overflow-x: auto; flex: 1;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none; margin-left: 4px;
        padding-bottom: 2px;
      }
      .grade-selector::-webkit-scrollbar { display: none; }
      .grade-btn { padding: 5px 13px; white-space: nowrap; font-size: .76rem; }

      /* Main layout height respects top bar */
      #main {
        height: calc(100dvh - var(--topbar-h) - var(--safe-top));
      }

      /* Sidebar → slide-in drawer */
      #sidebar {
        position: fixed;
        top: 0; left: 0; bottom: 0;
        width: min(80vw, 300px);
        z-index: 250;
        padding-top: calc(var(--topbar-h) + var(--safe-top) + 4px);
        transform: translateX(-100%);
        transition: transform .3s cubic-bezier(.4,0,.2,1);
        box-shadow: 4px 0 24px rgba(0,0,0,.4);
      }
      #sidebar.open { transform: translateX(0); }

      /* Content panel */
      .panel-top { padding: 10px 16px 0; }
      .content-area {
        padding: 16px 16px 20px;
        padding-bottom: calc(var(--bnav-h) + var(--safe-bottom) + 20px);
        -webkit-overflow-scrolling: touch;
      }

      /* Tab strip: scrollable */
      .tab-strip {
        overflow-x: auto; scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .tab-strip::-webkit-scrollbar { display: none; }
      .tab-btn   { padding: 9px 14px; font-size: .82rem; white-space: nowrap; }

      /* Cards and content */
      .q-card    { padding: 18px 16px; }
      .lesson-section, .lesson-intro, .key-facts,
      .drill-setup { max-width: 100%; }

      /* Matching columns: stack vertically on narrow screens */
      .match-cols { flex-direction: column; gap: 8px; }
      .match-col  { width: 100%; }

      /* Worked example steps */
      .we-step    { padding: 12px 14px; }

      /* End screen: compact */
      .end-screen { padding: 24px 16px; }

      /* Options grid: single column if needed */
      .mc-options { gap: 8px; }
    }

    @media (max-width: 400px) {
      .logo-accent { display: none; }
      .stat-badge .si { display: none; }
    }

    /* ── REDUCED MOTION ──────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>

  <div id="sidebar-overlay"></div>

  <header id="top-bar">
    <button class="hamburger" id="hamburger-btn" aria-label="Open menu">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div class="logo">📐 Math<span class="logo-accent">Master</span></div>
    <div class="grade-selector" id="grade-selector"></div>
    <div class="top-stats">
      <div class="stat-badge"><span class="si">🔥</span><span class="stat-num" id="streak-count">0</span></div>
      <div class="stat-badge"><span class="si gold">⭐</span><span class="stat-num" id="xp-count">0</span><span style="font-size:.74rem;opacity:.55;margin-left:2px">XP</span></div>
    </div>
  </header>

  <div id="main">
    <nav id="sidebar"></nav>
    <main id="content-panel">
      <div class="panel-top">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="tab-strip"  id="tab-strip"></div>
      </div>
      <div class="content-area" id="content-area"></div>
    </main>
  </div>

  <div id="feedback-overlay"></div>

  <nav id="bottom-nav" aria-label="Mobile navigation">
    <div class="bnav-inner">
      <button class="bnav-btn" id="bnav-topics" aria-label="Topics">
        <i class="fa-solid fa-list"></i>Topics
      </button>
      <button class="bnav-btn" id="bnav-lesson" aria-label="Lesson">
        <i class="fa-solid fa-book-open"></i>Lesson
      </button>
      <button class="bnav-btn" id="bnav-examples" aria-label="Examples">
        <i class="fa-solid fa-lightbulb"></i>Examples
      </button>
      <button class="bnav-btn" id="bnav-drill" aria-label="Practice">
        <i class="fa-solid fa-pen-to-square"></i>Practice
      </button>
    </div>
  </nav>

  <script>
  'use strict';

  /* ═══════════════════════════════════════════════════════════
     VISUAL COMPONENT LIBRARY
     All functions return HTML strings ready for innerHTML.
  ═══════════════════════════════════════════════════════════ */

  const VC = {

    /* Place-value chart for any integer up to 9 digits */
    placeValueChart(number) {
      const abs   = Math.abs(number);
      const str   = String(abs);
      const cols  = ['Billions','Hundred M','Ten M','Millions','H. Thou.','T. Thou.','Thousands','Hundreds','Tens','Units'];
      const pad   = cols.length;
      const padded = str.padStart(pad, ' ');
      const digits = padded.split('');

      // Only show columns from first significant digit onward
      const firstSig = digits.findIndex(d => d !== ' ');
      const visibleCols  = cols.slice(firstSig);
      const visibleDigits = digits.slice(firstSig);

      const ths = visibleCols.map(c  => `<th>${c}</th>`).join('');
      const tds = visibleDigits.map(d => {
        const val = d.trim();
        const hl  = val !== '' && val !== '0' ? ' class="hl"' : '';
        return `<td${hl}>${val || '&nbsp;'}</td>`;
      }).join('');

      return `<div class="visual-wrap">
        <table class="pv-table"><thead><tr>${ths}</tr></thead>
        <tbody><tr>${tds}</tr></tbody></table>
      </div>`;
    },

    /* Horizontal number line (SVG) */
    numberLine(min, max, points, highlight) {
      // points = [{val, label}], highlight = [val,…] shown in accent colour
      const W = 520, H = 64, padX = 28;
      const range = max - min || 1;
      const toX   = v => padX + ((v - min) / range) * (W - 2 * padX);

      // Auto step so we don't draw more than ~15 ticks
      const rawStep = Math.ceil((max - min) / 14);
      const step    = rawStep < 1 ? 1 : rawStep;

      let ticks = '';
      for (let v = min; v <= max; v += step) {
        const x  = toX(v);
        const hl = highlight && highlight.includes(v);
        ticks += `<line x1="${x}" y1="26" x2="${x}" y2="${hl ? 34 : 32}"
                    stroke="${hl ? '#f59e0b' : '#94a3b8'}" stroke-width="${hl ? 2 : 1}"/>
                  <text x="${x}" y="48" text-anchor="middle" font-size="11"
                    fill="${hl ? '#0f172a' : '#94a3b8'}"
                    font-weight="${hl ? 700 : 400}">${v}</text>`;
      }

      let dots = '';
      if (points) {
        points.forEach(p => {
          const x = toX(p.val);
          dots += `<circle cx="${x}" cy="30" r="6" fill="#6366f1" stroke="white" stroke-width="2"/>`;
          if (p.label) {
            dots += `<text x="${x}" y="18" text-anchor="middle" font-size="11"
                       fill="#6366f1" font-weight="700">${p.label}</text>`;
          }
        });
      }

      return `<div class="visual-wrap">
        <svg width="100%" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">
          <line x1="${padX}" y1="30" x2="${W - padX}" y2="30" stroke="#94a3b8" stroke-width="2"/>
          <polygon points="${W-padX},30 ${W-padX-8},26 ${W-padX-8},34" fill="#94a3b8"/>
          ${ticks}${dots}
        </svg>
      </div>`;
    },

    /* Horizontal fraction bar */
    fractionBar(numerator, denominator, label) {
      let segs = '';
      for (let i = 0; i < denominator; i++) {
        segs += `<div class="fbar-seg ${i < numerator ? 'filled' : 'empty'}"></div>`;
      }
      const lbl = label ? ` — ${label}` : '';
      return `<div class="visual-wrap">
        <div class="fbar-wrap">
          <div class="fbar-label"><strong>${numerator}/${denominator}</strong>${lbl}</div>
          <div class="fbar">${segs}</div>
        </div>
      </div>`;
    },

    /* Pie-slice fraction circle (SVG) */
    fractionCircle(numerator, denominator) {
      const r = 70, cx = 80, cy = 80;
      const angle = (2 * Math.PI) / denominator;
      let paths = '';
      for (let i = 0; i < denominator; i++) {
        const a1 = i * angle - Math.PI / 2;
        const a2 = (i + 1) * angle - Math.PI / 2;
        const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
        const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
        const lg = angle > Math.PI ? 1 : 0;
        const fill = i < numerator ? '#10b981' : '#e5e7eb';
        paths += `<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)}
                    A${r},${r} 0 ${lg} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z"
                   fill="${fill}" stroke="white" stroke-width="1.5"/>`;
      }
      return `<div class="visual-wrap">
        <svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
          ${paths}
          <text x="${cx}" y="${cy + 5}" text-anchor="middle" font-size="14"
            font-weight="700" fill="white" font-family="JetBrains Mono,monospace">
            ${numerator}/${denominator}
          </text>
        </svg>
      </div>`;
    },

    /* 4-quadrant coordinate grid (SVG) */
    coordinateGrid(points, lines) {
      const SIZE = 280, PAD = 28, UNITS = 5;   // ±5 on each axis
      const STEP = (SIZE - 2 * PAD) / (UNITS * 2);
      const toSX = x =>  PAD + (x + UNITS) * STEP;
      const toSY = y =>  PAD + (UNITS - y) * STEP;

      let grid = '';
      for (let i = -UNITS; i <= UNITS; i++) {
        const px = toSX(i), py = toSY(i);
        const dim = i === 0 ? '#94a3b8' : '#e5e7eb';
        grid += `<line x1="${px}" y1="${PAD}" x2="${px}" y2="${SIZE-PAD}" stroke="${dim}" stroke-width="1"/>
                 <line x1="${PAD}" y1="${py}" x2="${SIZE-PAD}" y2="${py}" stroke="${dim}" stroke-width="1"/>`;
        if (i !== 0) {
          grid += `<text x="${px}" y="${toSY(0)+14}" text-anchor="middle" font-size="9" fill="#94a3b8">${i}</text>
                   <text x="${toSX(0)-7}" y="${py+3}" text-anchor="end" font-size="9" fill="#94a3b8">${i}</text>`;
        }
      }
      const axes = `
        <line x1="${PAD}" y1="${toSY(0)}" x2="${SIZE-PAD}" y2="${toSY(0)}" stroke="#374151" stroke-width="1.5"/>
        <line x1="${toSX(0)}" y1="${PAD}" x2="${toSX(0)}" y2="${SIZE-PAD}" stroke="#374151" stroke-width="1.5"/>
        <text x="${SIZE-PAD+4}" y="${toSY(0)+4}" font-size="10" fill="#374151" font-weight="600">x</text>
        <text x="${toSX(0)+4}" y="${PAD-4}" font-size="10" fill="#374151" font-weight="600">y</text>`;

      let svgLines = '';
      if (lines) {
        lines.forEach(l => {
          svgLines += `<line x1="${toSX(l[0][0])}" y1="${toSY(l[0][1])}"
                            x2="${toSX(l[1][0])}" y2="${toSY(l[1][1])}"
                            stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,2"/>`;
        });
      }

      let dots = '';
      if (points) {
        points.forEach(([px, py]) => {
          dots += `<circle cx="${toSX(px)}" cy="${toSY(py)}" r="5"
                    fill="#6366f1" stroke="white" stroke-width="1.5"/>
                  <text x="${toSX(px)+8}" y="${toSY(py)-4}" font-size="10"
                    fill="#6366f1" font-weight="700">(${px},${py})</text>`;
        });
      }

      return `<div class="visual-wrap">
        <svg width="${SIZE}" height="${SIZE}" viewBox="0 0 ${SIZE} ${SIZE}" xmlns="http://www.w3.org/2000/svg">
          ${grid}${axes}${svgLines}${dots}
        </svg>
      </div>`;
    },

    /* SVG progress ring (used in sidebar) */
    progressRing(pct, accent) {
      const r = 13, circ = +(2 * Math.PI * r).toFixed(2);
      const offset = +(circ - (pct / 100) * circ).toFixed(2);
      return `<svg class="ring-svg" width="32" height="32" viewBox="0 0 32 32"
                   xmlns="http://www.w3.org/2000/svg">
        <circle class="ring-bg"   cx="16" cy="16" r="${r}" stroke-width="3"/>
        <circle class="ring-fill" cx="16" cy="16" r="${r}" stroke="${accent}"
          stroke-width="3" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/>
      </svg>`;
    },

    /* Render a visual based on topic lesson visual config */
    fromConfig(visual) {
      if (!visual) return '';
      const { type, data } = visual;
      switch (type) {
        case 'place-value-chart':
          return VC.placeValueChart(data.number);
        case 'number-line':
          return VC.numberLine(data.min, data.max, data.points, data.highlight);
        case 'fraction-bar':
          return VC.fractionBar(data.numerator, data.denominator, data.label);
        case 'fraction-circle':
          return VC.fractionCircle(data.numerator, data.denominator);
        case 'coordinate-grid':
          return VC.coordinateGrid(data.points, data.lines);
        case 'table': {
          const hdr = data.headers.map(h => `<th>${h}</th>`).join('');
          const rows = data.rows.map(r =>
            `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`
          ).join('');
          return `<div class="visual-wrap">
            <table class="pv-table"><thead><tr>${hdr}</tr></thead>
            <tbody>${rows}</tbody></table>
          </div>`;
        }
        case 'bar-chart':
        case 'line-chart':
        case 'pie-chart':
          return `<div class="visual-wrap">
            <div style="position:relative;max-width:480px;height:260px">
              <canvas id="chart-${Date.now()}" data-cfg='${JSON.stringify(data)}'></canvas>
            </div>
          </div>`;
        default:
          return '';
      }
    }
  };

  /* Render Chart.js charts after inserting into DOM */
  function mountCharts(container) {
    container.querySelectorAll('canvas[data-cfg]').forEach(canvas => {
      try {
        const cfg = JSON.parse(canvas.dataset.cfg);
        new Chart(canvas, cfg);
      } catch(e) { console.warn('Chart render error', e); }
    });
  }

  /* Simple markdown-lite parser (bold, italic, code, newlines) */
  function md(text) {
    return text
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,     '<em>$1</em>')
      .replace(/`(.+?)`/g,       '<code>$1</code>')
      .replace(/\n/g,            '<br>');
  }

    progress: {
      _KEY_P: 'mathmaster_progress',
      _KEY_X: 'mathmaster_xp',
      _KEY_S: 'mathmaster_streak',
      data:   {},
      xp:     0,
      streak: 0,

      load() {
        try {
          this.data   = JSON.parse(localStorage.getItem(this._KEY_P) || '{}');
          this.xp     = parseInt(localStorage.getItem(this._KEY_X)  || '0', 10);
          App.state.displayXP = this.xp;
          const raw   = JSON.parse(localStorage.getItem(this._KEY_S) || '{"d":"","n":0}');
          const today = new Date().toISOString().slice(0, 10);
          const yday  = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
          if (raw.d === today) {
            this.streak = raw.n;
          } else if (raw.d === yday) {
            this.streak = raw.n + 1;
            localStorage.setItem(this._KEY_S, JSON.stringify({ d: today, n: this.streak }));
          } else {
            this.streak = 1;
            localStorage.setItem(this._KEY_S, JSON.stringify({ d: today, n: 1 }));
          }
        } catch(e) { console.warn('Progress load error', e); }
      },

      save() {
        try { localStorage.setItem(this._KEY_P, JSON.stringify(this.data)); } catch(e) {}
      },

      key(grade, modId, topicId) { return `${grade}.${modId}.${topicId}`; },

      get(grade, modId, topicId) {
        const k = this.key(grade, modId, topicId);
        if (!this.data[k]) this.data[k] = { done: false, best: 0, tries: 0 };
        return this.data[k];
      },

      isDone(grade, modId, topicId) { return this.get(grade, modId, topicId).done; },

      recordDrill(grade, modId, topicId, score, total) {
        const d  = this.get(grade, modId, topicId);
        d.tries++;
        const pct = Math.round((score / total) * 100);
        if (pct > d.best) d.best = pct;
        if (pct >= 60) d.done = true;
        this.save();
      },

      addXP(amount) {
        this.xp += amount;
        localStorage.setItem(this._KEY_X, String(this.xp));
        App.ui.animateXP(amount);
        App.ui.xpPop(amount);
      },

      markLessonDone(grade, modId, topicId) {
        const d = this.get(grade, modId, topicId);

        this.save();

      modProgress(grade, modId) {
        const mod = (curriculum[grade]?.modules || []).find(m => m.id === modId);
        if (!mod) return { done: 0, total: 0 };
        const done = mod.topics.filter(t => this.isDone(grade, modId, t.id)).length;

        const end = App.progress.xp;

        const dur   = 600;
        const t0    = performance.now();

          const p = Math.min((now - t0) / dur, 1);
          el.textContent = Math.round(start + p * amount);
          if (p < 1) requestAnimationFrame(tick);

  /* ═══════════════════════════════════════════════════════════
     DRILL ENGINE  (question types, timer, scoring, end screen)
  ═══════════════════════════════════════════════════════════ */

  const Drill = {
    /* Config chosen on setup screen */
    cfg: { mode: 'untimed', difficulty: 'mixed', count: 10, scope: 'topic' },
    /* Runtime */
    questions:   [],
    index:       0,
    answers:     [],   // { question, userAnswer, correct }
    consecutive: 0,
    timerSec:    0,
    timerInterval: null,
    submitted:   false,

    /* ── SELECT QUESTIONS ─────────────────────────────────── */
    selectQuestions(topic, mod) {
      let pool = [];
      if (this.cfg.scope === 'topic') {
        pool = [...(topic.questions || [])];
      } else {
        (mod?.topics || []).forEach(t => pool.push(...(t.questions || [])));
      }

      // Filter by difficulty
      if (this.cfg.difficulty === 'easy')   pool = pool.filter(q => q.difficulty === 1);
      if (this.cfg.difficulty === 'hard')   pool = pool.filter(q => q.difficulty === 3);
      // 'mixed' keeps all

      // Shuffle
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      return pool.slice(0, this.cfg.count);
    },

    /* ── ANSWER CHECKING ─────────────────────────────────── */
    check(question, userAnswer) {
      switch (question.type) {
        case 'multiple-choice':
          return String(userAnswer).trim() === String(question.answer).trim();

        case 'numeric-input': {
          const ua = parseFloat(String(userAnswer).replace(/[,\s]/g, ''));
          const ca = parseFloat(String(question.answer).replace(/[,\s]/g, ''));
          return !isNaN(ua) && !isNaN(ca) && ua === ca;
        }

        case 'fill-in-the-blank': {
          const ua = String(userAnswer).trim().toLowerCase().replace(/[,\s]/g, '');
          const ca = String(question.answer).trim().toLowerCase().replace(/[,\s]/g, '');
          return ua === ca;
        }

        case 'ordering': {
          const correct = question.answer.split(',').map(s => s.trim());
          if (!Array.isArray(userAnswer) || userAnswer.length !== correct.length) return false;
          return userAnswer.every((v, i) => v.trim() === correct[i]);
        }

        case 'matching': {
          if (typeof userAnswer !== 'object') return false;
          const ok = question.pairs.every(p => userAnswer[p.left] === p.right);
          return ok && Object.keys(userAnswer).length === question.pairs.length;
        }
      }
      return false;
    },

    /* ── XP CALCULATION ──────────────────────────────────── */
    calcXP(correct, total, difficulty) {
      const pct  = correct / total;
      const base = difficulty === 'easy' ? 20 : difficulty === 'hard' ? 50 : 35;
      if (pct === 1) return base;
      return 10;  // participation XP
    },

    /* ── SETUP SCREEN ────────────────────────────────────── */
    renderSetup(topic, area) {
      area.innerHTML = `
        <div class="drill-setup">
          <h1><i class="fa-solid fa-pen-to-square" style="font-size:1.2rem;margin-right:6px"></i>Drill</h1>
          <p class="sub">${topic.label}</p>

          <div class="setup-group">
            <label>Mode</label>
            <div class="pill-group">
              <button class="pill sel" data-k="mode" data-v="untimed">Untimed</button>
              <button class="pill" data-k="mode" data-v="timed-5">5 min</button>
              <button class="pill" data-k="mode" data-v="timed-10">10 min</button>
              <button class="pill" data-k="mode" data-v="timed-15">15 min</button>
            </div>
          </div>

          <div class="setup-group">
            <label>Difficulty</label>
            <div class="pill-group">
              <button class="pill" data-k="difficulty" data-v="easy">Easy</button>
              <button class="pill sel" data-k="difficulty" data-v="mixed">Mixed</button>
              <button class="pill" data-k="difficulty" data-v="hard">Hard</button>
            </div>
          </div>

          <div class="setup-group">
            <label>Questions</label>
            <div class="pill-group">
              <button class="pill" data-k="count" data-v="5">5</button>
              <button class="pill sel" data-k="count" data-v="10">10</button>
              <button class="pill" data-k="count" data-v="20">20</button>
            </div>
          </div>

          <div class="setup-group">
            <label>Scope</label>
            <div class="pill-group">
              <button class="pill sel" data-k="scope" data-v="topic">This topic</button>
              <button class="pill" data-k="scope" data-v="module">Full module</button>
            </div>
          </div>

          <button class="btn-start" id="btn-start-drill">
            Start Drill <i class="fa-solid fa-play" style="margin-left:6px"></i>
          </button>
        </div>`;

      // Sync pill selections with cfg
      Object.entries(Drill.cfg).forEach(([k, v]) => {
        area.querySelectorAll(`[data-k="${k}"]`).forEach(p => {
          p.classList.toggle('sel', String(p.dataset.v) === String(v));
        });
      });

      area.querySelectorAll('.pill').forEach(p => {
        p.addEventListener('click', () => {
          const k = p.dataset.k, v = p.dataset.v;
          Drill.cfg[k] = k === 'count' ? parseInt(v, 10) : v;
          area.querySelectorAll(`[data-k="${k}"]`).forEach(b =>
            b.classList.toggle('sel', b.dataset.v === v)
          );
        });
      });

      area.querySelector('#btn-start-drill').addEventListener('click', () => {
        const topic = App.currentTopic();
        const mod   = App.currentModule();
        Drill.start(topic, mod, area);
      });
    },

    /* ── START ───────────────────────────────────────────── */
    start(topic, mod, area) {
      this.questions   = this.selectQuestions(topic, mod);
      this.index       = 0;
      this.answers     = [];
      this.consecutive = 0;
      this.submitted   = false;

      if (!this.questions.length) {
        area.innerHTML = `<div class="empty-state"><i class="fa-solid fa-circle-exclamation"></i>
          <p>No questions available for those settings. Try changing difficulty or scope.</p></div>`;
        return;
      }

      // Timer
      if (this.cfg.mode.startsWith('timed')) {
        const mins = parseInt(this.cfg.mode.split('-')[1], 10);
        this.timerSec = mins * 60;
      } else {
        this.timerSec = 0;
      }

      // Shuffle ordering items
      this.questions.forEach(q => {
        if (q.type === 'ordering' && q.items) {
          q._shuffled = [...q.items].sort(() => Math.random() - 0.5);
        }
        if (q.type === 'matching' && q.pairs) {
          q._rightShuffled = [...q.pairs].sort(() => Math.random() - 0.5).map(p => p.right);
        }
      });

      App.state.matchMap = {};
      App.state.matchSel = null;
      App.state.dragSrc  = null;

      this.renderQuestion(area);
      this.startTimer(area);
    },

    /* ── TIMER ───────────────────────────────────────────── */
    startTimer(area) {
      clearInterval(this.timerInterval);
      if (!this.timerSec) return;
      this.timerInterval = setInterval(() => {
        this.timerSec--;
        const el = area.querySelector('.drill-timer');
        if (el) {
          el.textContent = this.formatTime(this.timerSec);
          el.className = 'drill-timer' +
            (this.timerSec < 30 ? ' red' : this.timerSec < 60 ? ' amber' : '');
        }
        if (this.timerSec <= 0) {
          clearInterval(this.timerInterval);
          this.finish(area);
        }
      }, 1000);
    },

    stopTimer() { clearInterval(this.timerInterval); },

    formatTime(s) {
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${m}:${String(r).padStart(2, '0')}`;
    },

    /* ── RENDER QUESTION ─────────────────────────────────── */
    renderQuestion(area) {
      this.submitted = false;
      App.state.matchMap = {};
      App.state.matchSel = null;
      App.state.dragSrc  = null;

      const q     = this.questions[this.index];
      const pct   = Math.round((this.index / this.questions.length) * 100);
      const diffs = { 1: 'd1', 2: 'd2', 3: 'd3' };
      const diffL = { 1: 'Easy', 2: 'Medium', 3: 'Hard' };
      const timer = this.timerSec
        ? `<span class="drill-timer">${this.formatTime(this.timerSec)}</span>` : '';

      const streakMsg = this.consecutive >= 3
        ? `${this.consecutive} in a row! 🔥` : '';

      area.innerHTML = `
        <div class="drill-screen">
          <div class="drill-hd">
            <div class="drill-ptrack"><div class="drill-pfill" style="width:${pct}%"></div></div>
            <span class="drill-qnum">Q ${this.index + 1} / ${this.questions.length}</span>
            ${timer}
          </div>
          <div class="streak-msg">${streakMsg}</div>
          <div class="q-card">
            <div class="q-diff ${diffs[q.difficulty]}">${diffL[q.difficulty]}</div>
            <div class="q-prompt">${md(q.prompt)}</div>
            ${this.renderInput(q)}
          </div>
          <button class="btn-submit" id="btn-submit" disabled>Check Answer</button>
          <div class="expl-box" id="expl-box"></div>
          <button class="btn-next" id="btn-next">
            ${this.index >= this.questions.length - 1 ? 'See Results' : 'Next Question'} →
          </button>
        </div>`;

      this.wireInput(q, area);

      area.querySelector('#btn-submit').addEventListener('click', () => this.submitAnswer(q, area));

      area.querySelector('#btn-next').addEventListener('click', () => {
        this.index++;
        if (this.index >= this.questions.length) {
          this.stopTimer();
          this.finish(area);
        } else {
          this.renderQuestion(area);
        }
      });
    },

    /* ── RENDER INPUT ────────────────────────────────────── */
    renderInput(q) {
      switch (q.type) {
        case 'multiple-choice': {
          const letters = ['A','B','C','D','E'];
          return `<div class="mc-list">
            ${(q.options || []).map((opt, i) =>
              `<div class="mc-opt" data-val="${opt}">
                <span class="mc-ltr">${letters[i]}</span>
                <span>${opt}</span>
              </div>`
            ).join('')}
          </div>`;
        }
        case 'numeric-input':
          return `<div class="ni-wrap">
            <input class="ni-input" id="ni" type="text" inputmode="decimal" placeholder="Enter answer" autocomplete="off">
          </div>`;
        case 'fill-in-the-blank': {
          const parts = q.prompt.split('___');
          const html  = parts.map((p, i) =>
            i < parts.length - 1 ? `${p}<input class="fitb-in" id="fitb" autocomplete="off">` : p
          ).join('');
          return `<div class="fitb-text">${html}</div>`;
        }
        case 'ordering': {
          const items = q._shuffled || q.items || q.answer.split(',').map(s => s.trim());
          return `<div class="ord-list" id="ord-list">
            ${items.map((item, i) =>
              `<div class="ord-item" draggable="true" data-idx="${i}" data-val="${item}">
                <i class="fa-solid fa-grip-vertical ord-handle"></i>
                <span class="ord-text">${item}</span>
              </div>`
            ).join('')}
          </div>`;
        }
        case 'matching': {
          const rights = q._rightShuffled || q.pairs.map(p => p.right);
          return `<div class="match-grid">
            <div class="match-col">
              <div class="match-lbl">Column A</div>
              ${q.pairs.map(p =>
                `<div class="match-item" data-col="left" data-val="${p.left}">${p.left}</div>`
              ).join('')}
            </div>
            <div class="match-col">
              <div class="match-lbl">Column B</div>
              ${rights.map(r =>
                `<div class="match-item" data-col="right" data-val="${r}">${r}</div>`
              ).join('')}
            </div>
          </div>`;
        }
        default: return `<p>Unsupported question type: ${q.type}</p>`;
      }
    },

    /* ── WIRE INTERACTIONS ───────────────────────────────── */
    wireInput(q, area) {
      const submit = () => { if (!this.submitted) area.querySelector('#btn-submit').disabled = false; };

      switch (q.type) {
        case 'multiple-choice':
          area.querySelectorAll('.mc-opt').forEach(opt => {
            opt.addEventListener('click', () => {
              if (this.submitted) return;
              area.querySelectorAll('.mc-opt').forEach(o => o.classList.remove('sel'));
              opt.classList.add('sel');
              submit();
            });
          });
          break;

        case 'numeric-input': {
          const inp = area.querySelector('#ni');
          if (inp) {
            inp.addEventListener('input', submit);
            inp.addEventListener('keydown', e => {
              if (e.key === 'Enter' && !this.submitted) this.submitAnswer(q, area);
            });
            setTimeout(() => inp.focus(), 50);
          }
          break;
        }

        case 'fill-in-the-blank': {
          const inp = area.querySelector('#fitb');
          if (inp) {
            inp.addEventListener('input', submit);
            inp.addEventListener('keydown', e => {
              if (e.key === 'Enter' && !this.submitted) this.submitAnswer(q, area);
            });
            setTimeout(() => inp.focus(), 50);
          }
          break;
        }

        case 'ordering': {
          const list = area.querySelector('#ord-list');
          if (!list) break;
          let dragSrcEl = null;
          list.querySelectorAll('.ord-item').forEach(item => {
            item.addEventListener('dragstart', e => {
              dragSrcEl = item;
              item.classList.add('dragging');
              e.dataTransfer.effectAllowed = 'move';
            });
            item.addEventListener('dragend', () => {
              item.classList.remove('dragging');
              list.querySelectorAll('.ord-item').forEach(i => i.classList.remove('drag-over'));
              submit();
            });
            item.addEventListener('dragover', e => {
              e.preventDefault();
              if (item === dragSrcEl) return;
              list.querySelectorAll('.ord-item').forEach(i => i.classList.remove('drag-over'));
              item.classList.add('drag-over');
              e.dataTransfer.dropEffect = 'move';
            });
            item.addEventListener('drop', e => {
              e.preventDefault();
              if (item === dragSrcEl) return;
              const items = [...list.querySelectorAll('.ord-item')];
              const srcI  = items.indexOf(dragSrcEl);
              const tgtI  = items.indexOf(item);
              if (srcI < tgtI) list.insertBefore(dragSrcEl, item.nextSibling);
              else             list.insertBefore(dragSrcEl, item);
              list.querySelectorAll('.ord-item').forEach(i => i.classList.remove('drag-over'));
              submit();
            });
          });
          break;
        }

        case 'matching': {
          area.querySelectorAll('.match-item').forEach(item => {
            item.addEventListener('click', () => {
              if (this.submitted || item.classList.contains('matched')) return;
              const col = item.dataset.col;
              const val = item.dataset.val;

              if (!App.state.matchSel) {
                if (col === 'left') {
                  area.querySelectorAll('.match-item[data-col="left"]').forEach(i => i.classList.remove('sel'));
                  item.classList.add('sel');
                  App.state.matchSel = { col, val };
                }
              } else {
                if (col === 'right') {
                  // Make the match
                  App.state.matchMap[App.state.matchSel.val] = val;
                  // Update UI
                  area.querySelectorAll('.match-item[data-col="left"]').forEach(i => {
                    if (i.dataset.val === App.state.matchSel.val) {
                      i.classList.remove('sel');
                      i.classList.add('matched');
                    }
                  });
                  item.classList.add('matched');
                  App.state.matchSel = null;
                  // Enable submit when all matched
                  if (Object.keys(App.state.matchMap).length === q.pairs.length) submit();
                } else {
                  // Clicked left again
                  area.querySelectorAll('.match-item[data-col="left"]').forEach(i => i.classList.remove('sel'));
                  item.classList.add('sel');
                  App.state.matchSel = { col, val };
                }
              }
            });
          });
          break;
        }
      }
    },

    /* ── GET USER ANSWER ─────────────────────────────────── */
    getUserAnswer(q, area) {
      switch (q.type) {
        case 'multiple-choice': {
          const sel = area.querySelector('.mc-opt.sel');
          return sel ? sel.dataset.val : null;
        }
        case 'numeric-input':
          return area.querySelector('#ni')?.value.trim() ?? null;
        case 'fill-in-the-blank':
          return area.querySelector('#fitb')?.value.trim() ?? null;
        case 'ordering':
          return [...area.querySelectorAll('.ord-item')].map(i => i.dataset.val);
        case 'matching':
          return { ...App.state.matchMap };
        default: return null;
      }
    },

    /* ── SUBMIT ──────────────────────────────────────────── */
    submitAnswer(q, area) {
      if (this.submitted) return;
      this.submitted = true;

      const ua      = this.getUserAnswer(q, area);
      const correct = this.check(q, ua);

      this.answers.push({ question: q, userAnswer: ua, correct });
      this.consecutive = correct ? this.consecutive + 1 : 0;

      App.ui.flashFeedback(correct);

      // Lock inputs
      area.querySelectorAll('.mc-opt, .match-item, .ord-item').forEach(el => el.classList.add('locked'));
      const ni = area.querySelector('#ni, #fitb');
      if (ni) { ni.disabled = true; ni.classList.add(correct ? 'correct' : 'wrong'); }

      // Highlight MC
      if (q.type === 'multiple-choice') {
        area.querySelectorAll('.mc-opt').forEach(opt => {
          if (opt.dataset.val === q.answer) opt.classList.add('correct');
          else if (opt.classList.contains('sel')) opt.classList.add('wrong');
        });
      }

      // Highlight ordering
      if (q.type === 'ordering') {
        const correctOrder = q.answer.split(',').map(s => s.trim());
        area.querySelectorAll('.ord-item').forEach((item, i) => {
          item.classList.add(item.dataset.val.trim() === correctOrder[i] ? 'correct' : 'wrong');
        });
      }

      // Highlight matching
      if (q.type === 'matching') {
        q.pairs.forEach(p => {
          area.querySelectorAll('.match-item').forEach(item => {
            if (item.dataset.col === 'left' && item.dataset.val === p.left) {
              const matched = App.state.matchMap[p.left] === p.right;
              item.classList.remove('matched');
              item.classList.add(matched ? 'matched' : 'wrong-m');
            }
          });
        });
      }

      // Explanation
      const expl = area.querySelector('#expl-box');
      if (expl) {
        expl.className = `expl-box visible ${correct ? 'correct' : 'wrong'}`;
        const ansStr   = q.type === 'matching'
          ? q.pairs.map(p => `${p.left} → ${p.right}`).join(', ')
          : q.answer;
        expl.innerHTML = correct
          ? `<div class="expl-hd">✓ Correct!</div>${md(q.explanation || '')}`
          : `<div class="expl-hd">✗ Incorrect</div>
             <div>Correct answer: <span class="expl-ans">${ansStr}</span></div>
             <div style="margin-top:6px">${md(q.explanation || '')}</div>`;
      }

      area.querySelector('#btn-submit').disabled = true;
      const btnNext = area.querySelector('#btn-next');
      if (btnNext) btnNext.classList.add('visible');
    },

    /* ── FINISH / END SCREEN ─────────────────────────────── */
    finish(area) {
      this.stopTimer();
      const correct = this.answers.filter(a => a.correct).length;
      const total   = this.answers.length || this.questions.length;
      const pct     = Math.round((correct / total) * 100);
      const stars   = pct >= 90 ? '★★★' : pct >= 60 ? '★★☆' : '★☆☆';
      const xp      = this.calcXP(correct, total, this.cfg.difficulty);

      // Record progress
      const mod   = App.currentModule();
      const topic = App.currentTopic();
      if (mod && topic) {
        App.progress.recordDrill(App.state.grade, mod.id, topic.id, correct, total);
        App.progress.addXP(xp);
        App.buildSidebar();   // refresh rings
      }

      const wrongs = this.answers.filter(a => !a.correct);

      area.innerHTML = `
        <div class="end-screen">
          <div class="end-score">${correct} / ${total}</div>
          <div class="end-stars">${stars}</div>
          <div class="end-xp">+${xp} XP earned</div>
          <div class="end-stats">
            <div class="end-stat"><strong>${pct}%</strong>Score</div>
            <div class="end-stat"><strong>${correct}</strong>Correct</div>
            <div class="end-stat"><strong>${total - correct}</strong>Wrong</div>
          </div>
          <div class="end-actions">
            <button class="end-btn pri" id="btn-retry">Try Again</button>
            <button class="end-btn sec" id="btn-next-topic">Next Topic →</button>
          </div>
          ${wrongs.length ? `
            <div class="wrong-review">
              <h3>Review mistakes (${wrongs.length})</h3>
              ${wrongs.map(a => {
                const ansStr = a.question.type === 'matching'
                  ? a.question.pairs.map(p => `${p.left} → ${p.right}`).join(', ')
                  : a.question.answer;
                return `<div class="wrong-item">
                  <div class="wi-q">${a.question.prompt}</div>
                  <div class="wi-correct">✓ ${ansStr}</div>
                  <div class="wi-expl">${a.question.explanation || ''}</div>
                </div>`;
              }).join('')}
            </div>` : ''}
        </div>`;

      area.querySelector('#btn-retry').addEventListener('click', () => {
        App.renderDrillSetup(App.currentTopic(), area);
      });
      area.querySelector('#btn-next-topic').addEventListener('click', () => {
        const mod    = App.currentModule();
        const topics = mod?.topics || [];
        const curIdx = topics.findIndex(t => t.id === App.state.topicId);
        const next   = topics[curIdx + 1];
        if (next) App.selectTopic(mod.id, next.id);
        else      App.switchView('lesson');
      });
    },
  };

  /* Wire renderDrillSetup into App */
  App.renderDrillSetup = function(topic, area) {
    Drill.renderSetup(topic, area);
  };

              { heading: 'Basic Probability Concepts', body: '**Probability** measures how likely an event is to happen.\n\nProbability scale: 0 (impossible) → ½ (equally likely) → 1 (certain).\n\n**Outcome:** a single possible result (e.g. rolling a 3).\n**Event:** one or more outcomes (e.g. rolling an even number).\n**Sample space:** all possible outcomes (e.g. {1,2,3,4,5,6} for a die).\n\n**Theoretical probability:**\nP(event) = number of favourable outcomes ÷ total outcomes\n\nExample: P(rolling a 4 on a die) = 1/6.', visual: null },
              { heading: 'Theoretical vs Experimental Probability', body: '**Theoretical probability:** based on equally likely outcomes (maths).\n**Experimental probability:** based on actual results from trials.\nExperimental P = (number of times event occurred) ÷ (total number of trials)\n\nAs you do more trials, experimental probability gets closer to theoretical probability (**Law of Large Numbers**).\n\n**Complementary events:** P(event) + P(not event) = 1\nSo: P(not A) = 1 − P(A)\n\n**Listing outcomes:** use a list or table to find sample space for two events (e.g. flipping two coins: HH, HT, TH, TT).', visual: null }
            ],
            keyFacts: [
              'P(event) = favourable outcomes ÷ total outcomes.',
              'Probability is always between 0 and 1 (or 0% and 100%).',
              'P(not A) = 1 − P(A).',
              'More trials → experimental probability approaches theoretical probability.'
            ]
          },
